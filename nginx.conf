# ==============================================================================
# NGINX Configuration for C-Hear Technologies Limited (Single Page Application)
# Domain: www.c-hear.co.uk / c-hear.co.uk
# ==============================================================================

# HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name c-hear.co.uk www.c-hear.co.uk;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name c-hear.co.uk www.c-hear.co.uk;

    # SSL Certificate Configuration (Certbot / Custom SSL)
    ssl_certificate /etc/letsencrypt/live/c-hear.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-hear.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Root Directory (Path to unzipped static build)
    root /var/www/c-hear-technologies/dist;
    index index.html;

    # Character Encoding
    charset utf-8;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Static Assets Long-term Caching (JS, CSS, Images, Fonts)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    location /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # SPA Fallback Routing (React Router)
    # All routes that are not physical files fallback to index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # Ensure HTML entry point is never cached aggressively so updates are instant
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # --------------------------------------------------------------------------
    # Custom Error Handling
    # --------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Deny access to hidden / sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
